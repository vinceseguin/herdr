<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Herdr Fleet</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      #status { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Herdr Fleet</h1>
      <p id="status">checking&hellip;</p>
      <p>
        This is the placeholder shell the gateway embeds. The Preact app that
        replaces it ships with epic E4; until then use
        <code>GET /api/fleet</code>.
      </p>
    </main>
    <script>
      fetch("/api/gateway", { credentials: "same-origin" })
        .then(function (response) {
          if (!response.ok) throw new Error(String(response.status));
          return response.json();
        })
        .then(function (info) {
          document.getElementById("status").textContent =
            "paired as " + info.scope;
        })
        .catch(function () {
          document.getElementById("status").textContent =
            "not paired — run: herdr gateway pair";
        });
    </script>
  </body>
</html>
