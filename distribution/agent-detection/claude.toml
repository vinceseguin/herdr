id = "claude"
version = "2026.09.07.1"
min_engine_version = 2
updated_at = "2026-09-07T00:00:00Z"
aliases = ["claude-code"]

[[rules]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "osc_title"
visible_working = true
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[rules]]
id = "live_turn_working"
state = "working"
priority = 970
region = "bottom_non_empty_lines(12)"
visible_working = true
any = [
  { line_regex = ['^\s*[⏸⏵].*esc to interrupt(?:\s|·|$)'] },
  { line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+\S.*…(?:\s+\(\d+[smh](?:\s|·)|\s*$)'] },
]

[[rules]]
id = "background_agents_working"
state = "working"
priority = 965
region = "last_non_empty_above_prompt_box"
visible_working = true
line_regex = ['^\s*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}]\s+Waiting for [1-9]\d* background agents? to finish\s*$']

[[rules]]
id = "background_mcp_task_working"
state = "working"
priority = 965
region = "bottom_non_empty_lines(12)"
visible_working = true
# Claude renders activity summaries at column zero; wrapped continuations are indented.
# Keeping that shape prevents user prompt text from impersonating this signal.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]

[[rules]]
id = "btw_overlay_working"
state = "working"
priority = 975
region = "bottom_non_empty_lines(5)"
visible_working = true
line_regex = [
  '^\s*/btw(?:\s|$)',
  '(?i)esc to close\s*$',
]

[[rules]]
id = "transcript_viewer"
state = "unknown"
priority = 1000
region = "bottom_non_empty_lines(3)"
skip_state_update = true
contains = ["showing detailed transcript"]
any = [
  { contains = ["ctrl+o", "to toggle"] },
  { contains = ["ctrl+e", "show all"] },
  { contains = ["ctrl+e", "collapse"] },
  { contains = ["↑↓ scroll"] },
  { contains = ["? for shortcuts"] },
]

[[rules]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["esc to cancel"]
any = [
  { contains = ["enter to confirm"] },
  { contains = ["enter to select"], any = [
    { contains = ["tab/arrow keys to navigate"] },
    { contains = ["arrow keys to navigate"] },
    { contains = ["arrows to navigate"] },
    { contains = ["↑/↓ to navigate"] },
    { contains = ["↑↓ to navigate"] },
  ] },
]

[[rules]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
contains = ["run a dynamic workflow?", "esc to cancel"]

[[rules]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "whole_recent"
visible_blocker = true
# MCP elicitation dialogs (elicitation/create) show Accept/Decline controls
# with an "Esc to cancel" footer but no Enter hint, so live_blocked_form
# cannot see them (issue #3283). Gate on the invariant header line, the
# Accept/Decline control line, and the cancel footer.
contains = ["esc to cancel"]
line_regex = ['(?i)^\s*MCP server ["\x{201C}].+["\x{201D}] requests your input\s*$']
all = [
  { any = [
    { line_regex = ['^\s*\x{276F}?\s*Accept\b'] },
    { line_regex = ['^\s*\x{276F}?\s*Decline\b'] },
  ] },
]

[[rules]]
id = "usage_limit"
state = "blocked"
priority = 985
region = "after_last_horizontal_rule"
visible_blocker = true
# Claude Code's account usage limit. Blocked, not idle: the prompt still
# accepts typing, but nothing an agent is asked to do can run until the limit
# lifts, and herdr's account tooling offers switching to another profile.
#
# Priority 985 sits above live_blocked_form (980) so the limit wins while both
# are visible, and below transcript_viewer (1000) and osc_title_working (1100)
# so a scrolled-back transcript or a genuinely working turn still wins.
#
# The region is the status area below the current prompt box — the same one
# live_blocked_form reads — and not the bottom N lines, for two reasons that
# both matter here. A notice that has scrolled above the live box is history,
# not state: reading it as state would leave a *relaunched* agent looking
# limited because the previous session's screen is still on the pane. And a
# transcript can never reach this region, so an assistant turn discussing usage
# limits is structurally incapable of matching, not merely unlikely to.
#
# EVIDENCE, AND ITS LIMIT. Per AGENTS.md a rule of this kind comes from a live
# capture of the real screen. The usage-limit screen needs a rate-limited real
# account, which no local lab can produce, so the fixture behind this rule
# (tests/fixtures/fork/claude-usage-limit.txt) is *reconstructed* from Claude
# Code's known limit wording laid out in the live-captured prompt-box/footer
# shape. tests/fixtures/fork/README.md records that and the exact checks a
# human must run against a really limited account. The rule is therefore
# written to fail closed: two independent controls must both be present.
#
# 1. the notice itself, anchored either to the start of its own line or to a
#    "·"/"∙"/"|" separator inside the footer status line — so a wrapped
#    sentence in the middle of an assistant turn cannot impersonate it;
# 2. the control that always travels with it: when the limit lifts, or the
#    "/upgrade" that lifts it now.
#
# Residual risk, stated plainly: a Claude session that renders a real
# usage-limit notice *inside its own transcript* is indistinguishable from a
# limited one by screen scraping. tests/fixtures/fork/
# claude-usage-limit-negative.txt pins the ordinary prose case — "Claude usage
# limit reached" quoted mid-line, "resets at 14:00" as prose — as a non-match.
#
# REMOTE SHADOWING. A cached remote manifest whose version is greater than or
# equal to this one replaces the bundled file wholesale (src/detect/manifest.rs
# read_remote_manifest), so an upstream catalog published after this date would
# take this rule away without any error. The bundled version above is ahead of
# the published catalog today; a herdr that must not lose the rule sets
# `[update] manifest_check = false`, and `herdr agent explain <pane> --json`
# reports `manifest_source` so a caller can tell which file answered.
all = [
  { any = [
    { line_regex = ['(?i)(?:^|[\x{00B7}\x{2219}|]\s*)\s*\d+-hour limit reached\b'] },
    { line_regex = ['(?i)(?:^|[\x{00B7}\x{2219}|]\s*)\s*weekly limit reached\b'] },
    { line_regex = ['(?i)(?:^|[\x{00B7}\x{2219}|]\s*)\s*(?:claude )?usage limit reached\b'] },
  ] },
  { any = [
    { line_regex = ['(?i)\bresets?(?:\s+at)?\s+\d{1,2}(?::\d{2})?\s*[ap]\.?m\.?\b'] },
    { line_regex = ['(?i)\bresets?(?:\s+at)?\s+\d{1,2}:\d{2}\b'] },
    { line_regex = ['(?i)\blimit will reset at\b'] },
    { line_regex = ['(?i)^\s*/upgrade\b'] },
  ] },
]
# A dialog on top of the limit screen is the actionable thing, and a scrolled
# transcript is not the live state at all: defer to the rules that own them.
# The dialog controls listed here are the ones every Claude blocker draws
# inside this same region, so a permission prompt, an MCP dialog or a
# connection approval keeps its own rule (and its own advice) even while the
# account really is limited.
#
# The last entry closes the degenerate region. `after_last_horizontal_rule`
# falls back to the whole screen when the screen holds no rule at all — a
# Claude that is not drawing its prompt box — and a transcript paragraph can
# wrap "Claude usage limit reached. Your limit will reset at 3pm." onto an
# indented line of its own, which the headline anchor above would accept. A
# transcript turn bullet (U+23FA) or tool-result gutter (U+23BF) inside the
# region means the region is transcript rather than the live status area, so
# the rule declines it. The live footer never carries either marker.
not = [
  { contains = ["showing detailed transcript"] },
  { contains = ["do you want to proceed?"] },
  { contains = ["esc to cancel"] },
  { contains = ["esc to interrupt"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { line_regex = ['^\s*[\x{23FA}\x{23BF}]'] },
]

[[rules]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box_body"
visible_idle = true
line_regex = ['^\s*❯']
not = [
  { contains = ["enter to select"] },
  { contains = ["esc to cancel"] },
  { contains = ["tab/arrow keys"] },
  { contains = ["arrow keys to navigate"] },
  { contains = ["↑/↓ to navigate"] },
]

[[rules]]
id = "model_picker_menu"
state = "unknown"
priority = 900
region = "whole_recent"
skip_state_update = true
contains = ["select model", "enter to set as default", "esc to cancel"]
not = [
  { contains = ["do you want to proceed?"] },
  { contains = ["enter to select"] },
]

[[rules]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "whole_recent"
visible_blocker = true
contains = ["do you want to proceed?"]
any = [
  { contains = ["bash command"] },
  { contains = ["bash("] },
  { contains = ["contains expansion"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
]
# Claude marks the selected option with "❯", so every option branch has to allow
# that prefix. Numbered branches that omit it only match options the cursor has
# moved away from, which left the resting layout below unmatched here (#2650):
#   ❯ 1. Yes / 2. Yes, and don't ask again for: <cmd> / 3. No
# Cover both the two-option and "don't ask again" three-option shapes so this
# rule, not the narrower generic_permission_prompt, claims Bash approvals.
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*❯?\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*❯?\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_horizontal_rule"
visible_blocker = true
contains = ["do you want to proceed?", "esc to cancel"]
all = [
  { any = [
    { line_regex = ['(?i)^\s*❯?\s*1\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*yes\b'] },
    { line_regex = ['(?i)^\s*2\.\s*no\b'] },
    { line_regex = ['(?i)^\s*3\.\s*no\b'] },
  ] },
]

[[rules]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "whole_recent"
any = [
  { contains = ["do you want to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["would you like to"], any = [{ contains = ["yes"] }, { contains = ["❯"] }] },
  { contains = ["waiting for permission"] },
  { contains = ["do you want to allow this connection?"] },
  { contains = ["tab to amend"] },
  { contains = ["ctrl+e to explain"] },
  { contains = ["do you want to proceed?", "esc to cancel"] },
  { contains = ["review your answers"] },
  { contains = ["skip interview and plan immediately"] },
]
not = [
  { regex = ['(?m)^\s*❯\s*$'] },
]

[[rules]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "osc_title"
visible_idle = true
regex = ['^\x{2733} ']

[[rules]]
id = "osc_progress_idle"
state = "idle"
priority = 250
region = "osc_progress"
regex = ['^4;0']
